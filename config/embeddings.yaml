# NutriCHAT embedding + NLI model configuration
#
# provider: local (default) or siliconflow
provider: local

# Local model settings (used when provider: local)
local:
  model_path: ./models/Qwen3-Embedding-0.6B
  device: cuda

  # NLI model (the cross-encoder used by SelfCheckGPT)
  # model_path: local path, or a HuggingFace model name
  # device: inherits the embedding device by default; can be set separately
  # Reported checkpoint: MoritzLaurer/mDeBERTa-v3-base-mnli-xnli
  # Base revision: 8adb042d524ecd5c26d3e3ba0e3fbcf7e2d0864c
  nli:
    model_path: ./models/mdeberta-v3-mnli-xnli
    device: cuda

# SiliconFlow API settings (used when provider: siliconflow)
# The API key is reused from SILICONFLOW_API_KEY in .env
siliconflow:
  default_model: Qwen/Qwen3-Embedding-8B
  # Optional models (switch with default_model):
  # - Qwen/Qwen3-Embedding-8B:   highest quality, 8B parameters, 1024 dimensions
  # - Qwen/Qwen3-Embedding-4B:   balanced option, 4B parameters, 1024 dimensions
  # - Qwen/Qwen3-Embedding-0.6B: lightweight (same spec as the local model)
  # - netease-youdao/bce-embedding-base_v1: NetEase Youdao BCE embedding, 768 dimensions
