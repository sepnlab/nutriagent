# NutriCHAT ablation experiment configuration
#
# This configuration corresponds to the implementation in `src/evaluation/ablation.py`.
# Focus: Multi-Agent architecture (Router → Specialists → Synthesis),
# 7 ablation dimensions:
#   Dimension 1: Agent architecture — Single ReAct vs Multi-Agent
#   Dimension 2: Specialist marginal contribution — remove one specialist at a time
#   Dimension 3: Router strategy — LLM vs Keyword vs Broadcast
#   Dimension 4: RAG contribution — Multi-Agent with RAG vs without RAG
#   Dimension 5: Synthesis strategy — with/without the synthesis layer
#   Dimension 6: Base LLM ablation — same architecture, different backbones
#   Dimension 7: Cross-language — Chinese vs English queries

# ── Scoring component switches ──
# Ablations focus on architecture trends; SelfCheck can be enabled via config.local.yaml
scoring:
  evaluator_llm: true          # EvaluatorLLM (correctness / precision / depth)
  selfcheck: false             # SelfCheckGPT-NLI (off by default; enable in config.local.yaml)
  hallucination_ratio: 1.0     # SelfCheck sampling ratio (effective when selfcheck=true)
  flesch: true                 # Flesch Reading Ease readability
  tolerance: false             # Tolerance accuracy (ablations do not target numeric precision, so off)

# ── Dimension 1: Agent architecture ablation ──
#   Single ReAct → Multi-Agent (no tools) → Multi-Agent (single-pass) → Multi-Agent (full)
# The legacy "Multi-Agent (no ReAct)" entry never actually ran (dispatch case bug);
# it now exists only as a legacy alias mapped to single-pass. New configs must use
# the canonical names below.
architecture:
  enabled: true
  meta:
    title: "Agent Architecture Ablation"
    subtitle: "Single ReAct vs Multi-Agent (no tools / single-pass / full)"
    note: "Single ReAct → Multi-Agent no tools (parametric specialists) → Multi-Agent single-pass (one tool call per specialist) → Multi-Agent full (iterative ReAct). The single-pass vs full gap isolates iterative reasoning."
  variants:
    - name: "Single ReAct"
      description: "Single ReAct agent + all 4 tools (single-agent architecture baseline)"
    - name: "Multi-Agent (no tools)"
      description: "Router → 4 Specialists (no tools, parametric only) → Synthesis; measures the marginal contribution of routing + synthesis"
    - name: "Multi-Agent (single-pass tool call)"
      description: "Router → 4 Specialists (one tool call each, no iteration) → Synthesis; measures the marginal value of iterative reasoning"
    - name: "Multi-Agent (full)"
      description: "Router → 4 Specialists (ReAct with tools) → Synthesis"

# ── E1: Architecture factorial (data/tools/RAG/extra call/decomposition/validation) ──
architecture_factorial:
  enabled: true
  meta:
    title: "E1 Architecture Factorial"
    subtitle: "Standalone → Single ReAct+RAG → Single+RAG+synthesis → Multi-Agent (validation off/on)"
    note: "Separates data/tool access, RAG, the extra synthesis call, decomposition, and consistency checking. One grid, same backbone and output budget."
  variants:
    - name: "Standalone LLM"
      description: "Plain LLM, no tools / no RAG / no agent"
    - name: "Single ReAct + tools"
      description: "Single ReAct + 4 tools (no RAG)"
    - name: "Single ReAct + tools + RAG"
      description: "Single ReAct + 4 tools + RAG context"
    - name: "Single ReAct + tools + RAG + synthesis"
      description: "Single ReAct + RAG + one synthesis rewrite (no decomposition)"
    - name: "Multi-Agent (validation off)"
      description: "Multi-agent + synthesis, but consistency validation disabled"
    - name: "Multi-Agent (validation on)"
      description: "Multi-agent + synthesis + consistency validation (full multi-agent system)"

# ── E2: Synthesis factorial (integration vs validation vs extra call) ──
synthesis_factorial:
  enabled: true
  meta:
    title: "E2 Synthesis Factorial"
    subtitle: "Concatenation / validation+concatenation / synthesis (no validation / shuffled / correct) / query-only synthesis"
    note: "Separates integration, deterministic validation, and the extra LLM call; replaces the original D5 comparison."
  variants:
    - name: "Concatenation"
      description: "Concatenate specialist outputs directly (no validation, no synthesis)"
    - name: "Validation + concatenation"
      description: "Deterministic validation + concatenation (no synthesis LLM call)"
    - name: "Synthesis (validation off)"
      description: "Synthesis LLM, but validation warnings are not injected"
    - name: "Synthesis (shuffled warnings)"
      description: "Synthesis LLM + the same validation warnings in shuffled order"
    - name: "Synthesis (correct warnings)"
      description: "Synthesis LLM + correct validation warnings (full multi-agent system)"
    - name: "Query-only synthesis"
      description: "Give only the query to the synthesis LLM (extra-call control)"

# ── Dimension 2: Synthesis strategy ablation ──
# Marginal contribution of the synthesis layer: cross-validation + merging vs direct concatenation
synthesis:
  enabled: true
  meta:
    title: "Synthesis Strategy Ablation"
    subtitle: "With synthesis layer vs direct concatenation of specialist outputs"
    note: "Synthesis aggregates and cross-validates; without it, specialist outputs are concatenated"
  variants:
    - name: "With Synthesis"
      synthesis_enabled: true
      description: "Full synthesis layer (default)"
    - name: "Without Synthesis"
      synthesis_enabled: false
      description: "Concatenate specialist outputs directly"

# ── Dimension 3: Specialist ablation ──
# Remove one specialist at a time and observe the performance drop
specialist:
  enabled: true
  meta:
    title: "Specialist Ablation"
    subtitle: "Remove one specialist at a time and observe the performance drop"
    note: "↓ drop from Full = each specialist's marginal contribution"
  variants:
    - name: "Full (4 Specialists)"
      description: "All 4 specialists participate"
    - name: "Without Feed"
      exclude: feed
    - name: "Without Nutrition"
      exclude: nutrition
    - name: "Without Performance"
      exclude: performance
    - name: "Without Definitions"
      exclude: definitions

# ── Dimension 4: Router strategy ablation ──
# Compare the effect of different routing strategies on performance
router:
  enabled: true
  meta:
    title: "Router Strategy Ablation"
    subtitle: "LLM Router vs Keyword Fallback vs Broadcast (invoke all)"
    note: "Broadcast = 4 specialists all invoked; compares routing precision vs cost"
  variants:
    - name: "LLM Router"
      strategy: llm
      description: "LLM-classified routing (current default)"
    - name: "Keyword Router"
      strategy: keyword
      description: "Keyword fallback routing"
    - name: "Broadcast (All)"
      strategy: broadcast
      description: "Invoke all 4 specialists (no routing)"

# ── Dimension 5: RAG ablation (Multi-Agent context) ──
# Test the complementary value of RAG in the multi-agent architecture
rag:
  enabled: true
  meta:
    title: "RAG Ablation (Multi-Agent Context)"
    subtitle: "Multi-Agent with RAG vs without RAG"
    note: "RAG's contribution in multi-agent: still complements specialist knowledge?"
  variants:
    - name: "Multi-Agent + RAG"
      rag_enabled: true
      description: "Full Multi-Agent + RAG domain filtering"
    - name: "Multi-Agent (no RAG)"
      rag_enabled: false
      description: "Multi-Agent without RAG"

# ── Dimension 6: LLM Backbone ablation ──
# Performance of the same Multi-Agent architecture on different backbone LLMs
llm_backbone:
  enabled: true
  meta:
    title: "Backbone LLM Ablation"
    subtitle: "Multi-Agent architecture on different LLM backbones"
    note: "Same Multi-Agent architecture, different backbone LLMs"
  variants:
    - name: "Qwen3.5-27B"
      model: Qwen/Qwen3.5-27B
      description: "Qwen 3.5, 27B parameters"
    - name: "DeepSeek-V4-Flash"
      model: deepseek-ai/DeepSeek-V4-Flash
      description: "DeepSeek V4 Flash"
    # Use model_ref to reference a baseline from models.yaml (provider/base_url/api_key resolved automatically):
    # - name: "Aliyun Qwen3.6-Plus (ref)"
    #   model_ref: "aliyun/Qwen3.6-Plus"
    #   description: "Routed through the Alibaba Cloud API via model_ref"

# ── Dimension 7: Cross-language (English vs Chinese) ablation ──
# Performance difference of the same Multi-Agent architecture on English vs Chinese queries
language:
  enabled: true
  meta:
    title: "Cross-Language Ablation"
    subtitle: "English vs Chinese query performance"
    note: "Same Multi-Agent architecture, different query languages"
  variants:
    - name: "English"
      query_set: "western"
      description: "English queries (no CN- prefix)"
    - name: "Chinese"
      query_set: "chinese"
      description: "Chinese queries (CN- prefix)"
