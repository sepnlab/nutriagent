# NutriCHAT model configuration
#
# providers:   API provider connection info (base_url, api_key_env); role models reference a provider
# nutrichat:   the backbone model used by NutriCHAT itself (ReAct reasoning engine)
# evaluator:   EvaluatorLLM scoring model (thinking kept for scoring reasoning)
# selfcheck:   SelfCheckGPT multi-sampling model (inherits nutrichat by default)
# baselines:   list of comparison baseline models (see the baselines section below to add models)
#
# Thinking policy: thinking is disabled automatically for baselines by default (code injects
#           the provider-specific parameter); models that always think (DeepSeek-R1 etc.) are
#           protected by _THINKING_INHERENT.
#           Priority: explicit model entry field > _defaults > code auto-injection

# ── Provider definitions (shared connection info) ───────
# Note: the same model has different API model IDs on different platforms.
# When switching provider, the model field must use the ID format of that platform.
providers:
  - provider: siliconflow
    api_key_env: SILICONFLOW_API_KEY
    base_url: https://api.siliconflow.cn/v1
    # API compatibility: this provider must disable thinking when temperature>0, otherwise it returns an empty response
    always_disable_thinking: true
    # model format: {org}/{ModelName}, e.g. deepseek-ai/DeepSeek-V4-Flash

  - provider: aliyun
    api_key_env: ALIYUN_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # model format: all lower-case, e.g. qwen3.6-plus, glm-4.5-air

  - provider: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    # model format: deepseek-{version}, e.g. deepseek-v4-flash

  - provider: xiaomi
    api_key_env: XIAOMI_API_KEY
    base_url: https://api.xiaomimimo.com/v1
    # model format: mimo-{version}, e.g. mimo-v2.5-pro

  - provider: qianwen
    api_key_env: QWENAI_API_KEY
    base_url: https://maas.qianwenaiapi.com/compatible-mode/v1
    # Qianwen AI platform (OpenAI-compatible)
    # model format: qwen{major}.{minor}-{tier}, e.g. qwen3.8-flash
    # Use the model IDs listed under this provider.

  - provider: volcano
    api_key_env: HUOSHAN_API_KEY
    base_url: https://ark.cn-beijing.volces.com/api/v3
    # model format: {name}-{version}, e.g. doubao-seed-2-0-lite-260215

  - provider: tencent
    api_key_env: HUNYUAN_API_KEY
    base_url: https://tokenhub.tencentmaas.com/v1
    # model format: {short-name}, e.g. hy-mt2-pro, hy3-preview

# ── NutriCHAT base model (ReAct reasoning engine) ────────
# model  = API model ID (name is the display label; model is what is sent to the API — they differ)
#          the model format differs per provider, see the comments in the providers section above
nutrichat:
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 0.0
  max_tokens: 200

# ── EvaluatorLLM scoring model ──────────────────────────
# model  = API model ID, not the display name (unrelated to the baselines name field)
# extra_body = null → keep thinking mode (scoring needs reasoning analysis)
evaluator:
  # DeepSeek-V4-Pro as a robust judge; neither participates in per-query generation cost.
  provider: xiaomi
  model: mimo-v2.5-pro
  temperature: 0.0
  max_tokens: 8192
  extra_body: null

# ── SelfCheckGPT sampling model ─────────────────────────
# When provider/model are not specified, the nutrichat model and connection info are inherited
selfcheck:
  temperature: 1.0
  max_tokens: 200
  n_samples: 5
  extra_body:
    thinking:
      type: disabled

# ── Baseline comparison model list ──────────────────────
#
# name:   display name in reports, also the matching key for evaluate.yaml filtering and the thinking_baselines whitelist
# model:  the real model ID sent to the API (format see the provider section comments)
#         the same model has different IDs on different providers, so name and model may differ
#         e.g. name="siliconflow/DeepSeek-V4-Flash" but model="deepseek-ai/DeepSeek-V4-Flash"
#
# Adding a new model: add one name + model entry under the matching provider group
#   temperature / max_tokens / extra_body (thinking disabled) all have defaults, no need to specify
#   if the new model forces thinking (e.g. DeepSeek-R1), remember to add it to _THINKING_INHERENT
#
# Example - add a new model to siliconflow:
#   siliconflow:
#     - name: "siliconflow/Qwen3-Plus"
#       model: Qwen/Qwen3-Plus
baselines:
  _defaults:
    temperature: 0.0
    max_tokens: 200

  models:
    siliconflow:
      - name: "siliconflow/DeepSeek-V4-Flash"
        model: deepseek-ai/DeepSeek-V4-Flash

      - name: "siliconflow/Qwen3.5-27B"
        model: Qwen/Qwen3.5-27B

      - name: "siliconflow/MiniMax-M2.5"
        model: MiniMaxAI/MiniMax-M2.5

      - name: "siliconflow/Qwen3.5-9B"
        model: Qwen/Qwen3.5-9B

      - name: "siliconflow/Qwen3-8B"
        model: Qwen/Qwen3-8B

      - name: "siliconflow/Qwen3.6-27B"
        model: Qwen/Qwen3.6-27B

      - name: "siliconflow/Qwen3.6-35B-A3B"
        model: Qwen/Qwen3.6-35B-A3B

      - name: "siliconflow/DeepSeek-V3.2"
        model: deepseek-ai/DeepSeek-V3.2

      - name: "siliconflow/GLM-4.5-Air"
        model: zai-org/GLM-4.5-Air

    deepseek:
      - name: "deepseek/DeepSeek-V4-Flash"
        model: deepseek-v4-flash

      - name: "deepseek/DeepSeek-V4-Pro"
        model: deepseek-v4-pro

    aliyun:
