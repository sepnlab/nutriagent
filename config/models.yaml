# NutriCHAT 模型配置
#
# providers:   API 供应商连接信息（base_url, api_key_env），角色模型通过 provider 引用
# nutrichat:   NutriCHAT 自身使用的基座模型（ReAct 推理引擎）
# evaluator:   EvaluatorLLM 评分模型（保留思考用于评分推理）
# selfcheck:   SelfCheckGPT 多采样模型（默认继承 nutrichat）
# baselines:   对比基线模型列表（加新模型见下方 baselines 段说明）
#
# 思考策略：baselines 默认自动关闭思考（代码按 provider 注入对应参数），
#           强制思考的模型（DeepSeek-R1 等）由 _THINKING_INHERENT 保护。
#           优先级：模型条目的显式字段 > _defaults > 代码自动注入

# ── 供应商定义（共享连接信息）───────────────────────────
# 注意：同一模型在不同平台的 API 模型 ID 不同。
# 切换 provider 时，model 字段必须使用对应平台的 ID 格式。
providers:
  - provider: siliconflow
    api_key_env: SILICONFLOW_API_KEY
    base_url: https://api.siliconflow.cn/v1
    # API 兼容：该供应商在 temperature>0 时必须禁用 thinking，否则返回空响应
    always_disable_thinking: true
    # model 格式: {org}/{ModelName}，如 deepseek-ai/DeepSeek-V4-Flash

  - provider: aliyun
    api_key_env: ALIYUN_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # model 格式: 全小写，如 qwen3.6-plus、glm-4.5-air

  - provider: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    # model 格式: deepseek-{version}，如 deepseek-v4-flash

  - provider: xiaomi
    api_key_env: XIAOMI_API_KEY
    base_url: https://api.xiaomimimo.com/v1
    # model 格式: mimo-{version}，如 mimo-v2.5-pro

  - provider: qianwen
    api_key_env: QWENAI_API_KEY
    base_url: https://maas.qianwenaiapi.com/compatible-mode/v1
    # 千问AI平台（OpenAI 兼容）
    # model 格式: qwen{major}.{minor}-{tier}，如 qwen3.8-flash
    # 注意：该账户对 qwen3.5-flash / qwen3.6-plus / qwen3.7-plus 返回 403，
    #       qwen3.8-flash / qwen3.8-27b / qwen3.8-max 可用（2026-10-20 实测）。

  - provider: volcano
    api_key_env: HUOSHAN_API_KEY
    base_url: https://ark.cn-beijing.volces.com/api/v3
    # model 格式: {name}-{version}，如 doubao-seed-2-0-lite-260215

  - provider: tencent
    api_key_env: HUNYUAN_API_KEY
    base_url: https://tokenhub.tencentmaas.com/v1
    # model 格式: {short-name}，如 hy-mt2-pro、hy3-preview

# ── NutriCHAT 底座模型（ReAct 推理引擎）────────────────
# model  = API 模型 ID（name 是显示标签，model 才是传给 API 的 ID，两者不同）
#          各 provider 的 model 格式不同，见上方 providers 段的注释
nutrichat:
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 0.0
  max_tokens: 200

# ── EvaluatorLLM 评分模型 ──────────────────────────────
# model  = API 模型 ID，不是显示名（与 baselines 的 name 字段无关）
# extra_body = null → 保留思考模式（评分需要推理分析）
evaluator:
  # DeepSeek-V4-Pro 作为稳健性 judge；两者都不参与 per-query 生成成本。
  provider: xiaomi
  model: mimo-v2.5-pro
  temperature: 0.0
  max_tokens: 8192
  extra_body: null

# ── SelfCheckGPT 采样模型 ──────────────────────────────
# 不指定 provider/model 时默认继承 nutrichat 的模型和连接信息
selfcheck:
  temperature: 1.0
  max_tokens: 200
  n_samples: 5
  extra_body:
    thinking:
      type: disabled

# ── 基线对比模型列表 ───────────────────────────────────
#
# name:   报告中的显示名，也是 evaluate.yaml 过滤和 thinking_baselines 白名单的匹配键
# model:  传给 API 的真实模型 ID（格式见各 provider 段注释）
#         同一个模型在不同 provider 上的 ID 不同，所以 name 和 model 可以不一样
#         例：name="siliconflow/DeepSeek-V4-Flash" 但 model="deepseek-ai/DeepSeek-V4-Flash"
#
# 添加新模型：在对应 provider 组下加一条 name + model 即可
#   temperature / max_tokens / extra_body（关闭思考）均有默认值，无需手动指定
#   如果新模型强制开启思考（如 DeepSeek-R1），记得加到 _THINKING_INHERENT
#
# 示例 - 给 siliconflow 加一个新模型：
#   siliconflow:
#     - name: "siliconflow/Qwen3-Plus"
#       model: Qwen/Qwen3-Plus
baselines:
  _defaults:
    temperature: 0.0
    max_tokens: 200

  models:
    siliconflow:
      - name: "siliconflow/DeepSeek-V4-Flash"
        model: deepseek-ai/DeepSeek-V4-Flash

      - name: "siliconflow/Qwen3.5-27B"
        model: Qwen/Qwen3.5-27B

      - name: "siliconflow/MiniMax-M2.5"
        model: MiniMaxAI/MiniMax-M2.5

      - name: "siliconflow/Qwen3.5-9B"
        model: Qwen/Qwen3.5-9B

      - name: "siliconflow/Qwen3-8B"
        model: Qwen/Qwen3-8B

      - name: "siliconflow/Qwen3.6-27B"
        model: Qwen/Qwen3.6-27B

      - name: "siliconflow/Qwen3.6-35B-A3B"
        model: Qwen/Qwen3.6-35B-A3B

      - name: "siliconflow/DeepSeek-V3.2"
        model: deepseek-ai/DeepSeek-V3.2

      - name: "siliconflow/GLM-4.5-Air"
        model: zai-org/GLM-4.5-Air

    deepseek:
      - name: "deepseek/DeepSeek-V4-Flash"
        model: deepseek-v4-flash

      - name: "deepseek/DeepSeek-V4-Pro"
        model: deepseek-v4-pro

    aliyun:
      - name: "aliyun/Qwen3.6-Plus"
        model: qwen3.6-plus

      - name: "aliyun/Qwen3-32B"
        model: qwen3-32b

      - name: "aliyun/Qwen3.5-Flash"
        model: qwen3.5-flash

      - name: "aliyun/Qwen3.6-Flash"
        model: qwen3.6-flash

      - name: "aliyun/Qwen3.5-35B-A3B"
        model: qwen3.5-35b-a3b

      - name: "aliyun/Qwen3-8B"
        model: qwen3-8b

      - name: "aliyun/MiniMax-M2.5"
        model: MiniMax-M2.5

      - name: "aliyun/Qwen-Plus-2025-07-28"
        model: qwen-plus-2025-07-28

      - name: "aliyun/GLM-5"
        model: glm-5

      - name: "aliyun/Kimi-K2.5"
        model: kimi-k2.5

      - name: "aliyun/Kimi-K2.6"
        model: kimi-k2.6

    volcano:
      - name: "volcano/Doubao-Seed-2.0-Lite"
        model: doubao-seed-2-0-lite-260215

      - name: "volcano/Doubao-Seed-2.0-Pro"
        model: doubao-seed-2-0-pro-260215

      - name: "volcano/Doubao-Seed-2.0-Mini"
        model: doubao-seed-2-0-mini-260428

      - name: "volcano/Doubao-Seed-2.0-Lite-260428"
        model: doubao-seed-2-0-lite-260428

      - name: "volcano/Doubao-Seed-1.6"
        model: doubao-seed-1-6-251015

      - name: "volcano/Doubao-Seed-1.6-Flash"
        model: doubao-seed-1-6-flash-250828

      - name: "volcano/DeepSeek-V3.2"
        model: deepseek-v3-2-251201

      - name: "volcano/DeepSeek-R1"
        model: deepseek-r1-250120

    tencent:
      - name: "tencent/Hunyuan-MT2-Pro"
        model: hy-mt2-pro

      - name: "tencent/Hy3-Preview"
        model: hy3-preview

      - name: "tencent/Hy2-Instruct"
        model: hunyuan-2.0-instruct-20251111

      - name: "tencent/Hy2-Think"
        model: hunyuan-2.0-thinking-20251109

      - name: "tencent/GLM-5"
        model: glm-5

      - name: "tencent/MiniMax-M2.5"
        model: minimax-m2.5

    # ── 千问AI平台（OpenAI 兼容）────────────────────────────
    # 该账户当前可用的 Qwen 3.8 系列。
    qianwen:
      - name: "qianwen/Qwen3.8-Flash"
        model: qwen3.8-flash
      - name: "qianwen/Qwen3.8-27B"
        model: qwen3.8-27b
      - name: "qianwen/Qwen3.8-Max"
        model: qwen3.8-max
