        model: qwen3.6-plus

      - name: "aliyun/Qwen3-32B"
        model: qwen3-32b

      - name: "aliyun/Qwen3.5-Flash"
        model: qwen3.5-flash

      - name: "aliyun/Qwen3.6-Flash"
        model: qwen3.6-flash

      - name: "aliyun/Qwen3.5-35B-A3B"
        model: qwen3.5-35b-a3b

      - name: "aliyun/Qwen3-8B"
        model: qwen3-8b

      - name: "aliyun/MiniMax-M2.5"
        model: MiniMax-M2.5

      - name: "aliyun/Qwen-Plus-2025-07-28"
        model: qwen-plus-2025-07-28

      - name: "aliyun/GLM-5"
        model: glm-5

      - name: "aliyun/Kimi-K2.5"
        model: kimi-k2.5

      - name: "aliyun/Kimi-K2.6"
        model: kimi-k2.6

    volcano:
      - name: "volcano/Doubao-Seed-2.0-Lite"
        model: doubao-seed-2-0-lite-260215

