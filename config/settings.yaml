# NutriCHAT runtime settings
#
# API keys are still managed in .env (not committed)
# All other settings are centralized in this file and the YAML files under config/

# ---- Species ----
# broiler (meat-type chicken) or layer (egg-type chicken)
species: layer

# ---- Response generation ----
# Maximum number of tokens (the original single-agent NutriCHAT used 200; Multi-Agent Synthesis needs more room)
max_tokens: 512
# Token cap for specialist intermediate output (tool data retrieval only, no long answers needed)
specialist_max_tokens: 256
# Token cap for SelfCheckGPT sampling (NLI only checks whether facts exist, no full answer needed)
selfcheck_max_tokens: 200

# ---- Retrieval settings ----
retrieval:
  # Number of nearest-neighbor documents returned by RAG retrieval
  #   >1: multi-document retrieval, richer context (better with reranking)
  k: 1

# ---- API call settings ----
api:
  # LLM API timeout (seconds)
  #   60+: for unstable networks or overseas APIs
  timeout: 30

  # Maximum number of concurrent requests (controlled by _RateLimiter; 6 or less recommended)
  max_concurrent: 6

  # Automatic retry settings
  retry:
    # Maximum number of retries
    #   3: default, handles most transient API failures
    #   5+: when the API is frequently rate-limited
    max_attempts: 3

    # Initial exponential-backoff wait (seconds)
    #   1: fast retry
    min_wait: 2

    # Maximum exponential-backoff wait (seconds)
    #   30:  default, avoids long hangs
    #   120+: allows more aggressive retries
    max_wait: 30

  # Extra timeout when calling baseline models (secondary confirmation, specific to the paper's evaluation environment)
  # Empty = use api.timeout
  baseline_timeout:

# ---- Agent settings ----
agent:
  # Router LLM parameters
  router:
    temperature: 0.0
    max_tokens: 200

  # Synthesis LLM parameters (Config.MAX_TOKENS is used by default; no extra setting needed)
  synthesis:
    temperature: 0.0

  # ReAct Agent parameters
  max_iterations: 7
  early_stopping: true

# ---- Evaluation settings (overridable by evaluate.yaml) ----
evaluation:
  # SelfCheckGPT randomly skips a proportion of queries (0=skip, 1.0=all)
  # Defaults are defined in evaluate.yaml; this is only a fallback
  hallucination_ratio: 1.0
  # Stratified sampling (null=all, 0.0-1.0=proportional, >=1=fixed N per category)
  sample_ratio: null

# ---- Baseline model settings ----
baselines:
  # Default max_tokens for thinking models (thinking_baselines)
  # The reasoning process consumes extra tokens, so the default is larger than for normal models
  thinking_max_tokens: 4096
