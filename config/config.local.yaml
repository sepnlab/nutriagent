# ═══════════════════════════════════════════════════════════════
# NutriAgent — local experiment override configuration
# ═══════════════════════════════════════════════════════════════
#
# deep-merged on top of evaluate.yaml and models.yaml.
# Kept under version control so experiment parameters are managed centrally.
#
# The three experiment modes each have their own scoring section, applied on demand:
#   scoring_evaluate → applies only to --evaluate
#   scoring_compare  → applies only to --compare
#   scoring_ablation → applies only to --ablation
#   scoring          → applies to all three (default values)
# ═══════════════════════════════════════════════════════════════

# ── Backbone model ───────────────────────────────────────────
# Note: key names must match nutrichat: in models.yaml
nutrichat:
  model: deepseek-ai/DeepSeek-V4-Flash
  provider: siliconflow

# ── EvaluatorLLM scoring model ────────────────────────────────
evaluator:
  model: mimo-v2.5-pro
  provider: xiaomi

# ── Evaluation sampling ──────────────────────────────────────
# Use the curated 54-query file, or --quick for a 3% sample.
evaluation:
  sample_ratio: null          # null=no sampling; with --query-file all 54 queries are used

# ── Comparison baselines ─────────────────────────────────────
# Few-but-strong approach: weak/mid/strong tiers + backbone control, spanning the capability spectrum
baselines:
  - siliconflow/DeepSeek-V4-Flash       # backbone control (same model without architecture, quantifies architecture value)
  - siliconflow/Qwen3-8B                # weak tier (8B small model)
  - qianwen/Qwen3.8-Flash               # weak-mid tier
  - siliconflow/GLM-4.5-Air             # mid tier (Zhipu; cross-vendor generalization check)
  - tencent/MiniMax-M2.5                # mid tier
  - deepseek/DeepSeek-V4-Pro            # strong tier (flagship)

# ── Other parameters ─────────────────────────────────────────
species: layer
agent_mode: multi
breakdown: true
max_tokens: 512
api:
  timeout: 30
  max_concurrent: 4  # DeepSeek official TPM limits are relatively generous
retrieval:
  k: 1

# ── Thinking-mode whitelist ──────────────────────────────────
thinking_baselines: null

# ── Ablation experiment configuration ────────────────────────
# dimensions: controls which ablation dimensions to run (null=all, list=selected dimensions)
# Allowed values: architecture, synthesis, specialist, router, rag, llm_backbone, language
ablation:
  dimensions:                    # null=all; an explicit list=only these dimensions
    - architecture
    - architecture_factorial
    - synthesis_factorial
    - rag
    - router
    - synthesis
    - specialist
    - llm_backbone
    - language
  llm_backbone:                    # overrides the ablation.yaml default: weak/mid/strong tiers + backbone control
    - siliconflow/Qwen3-8B         # weak tier (8B small model)
    - qianwen/Qwen3.8-Flash        # weak-mid tier (replaces Qwen3.5-Flash)
    - siliconflow/DeepSeek-V4-Flash  # backbone control (NutriAgent default backbone)
    - qianwen/Qwen3.8-27B          # mid-strong tier (replaces Qwen3.6-Plus)
    - deepseek/DeepSeek-V4-Pro     # strong tier (flagship)

# ──────────────────────────────────────────────────────────────
# Scoring component switches (by experiment mode)
# ──────────────────────────────────────────────────────────────

# --evaluate scoring: full evaluation
scoring_evaluate:
  evaluator_llm: true
  selfcheck: true
  hallucination_ratio: 1.0
  n_selfcheck_values: [5]
  tolerance: true
  flesch: true
  quick:
    sample_ratio: 0.1
    selfcheck: false               # off for --quick to save tokens
    hallucination_ratio: 1.0

scoring_compare:
  evaluator_llm: true
  selfcheck: true
  hallucination_ratio: 1.0
  n_selfcheck_values: [5]          # same as evaluate
  tolerance: true                  # objective numeric precision, always on
  flesch: true
  quick:
    sample_ratio: 0.1
    selfcheck: false               # off for --quick to save tokens
    hallucination_ratio: 1.0

scoring_ablation:
  evaluator_llm: true
  selfcheck: true
  hallucination_ratio: 0.0                 # 0=skip SelfCheck for a fast report
  n_selfcheck_values: [5]
  tolerance: true
  flesch: false
  quick:
    sample_ratio: 0.1
    selfcheck: false               # off for --quick to save tokens
    hallucination_ratio: 1.0
