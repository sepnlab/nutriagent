# ═══════════════════════════════════════════════════════════════
# NutriAgent — 本地实验覆盖配置
# ═══════════════════════════════════════════════════════════════
#
# deep-merge 到 evaluate.yaml 和 models.yaml 之上。
# 纳入版本控制，统一管理实验参数。
#
# 三种实验模式各有独立的 scoring 段，按需覆盖：
#   scoring_evaluate → 仅 --evaluate 生效
#   scoring_compare  → 仅 --compare 生效
#   scoring_ablation → 仅 --ablation 生效
#   scoring          → 以上三种均生效（默认值）
# ═══════════════════════════════════════════════════════════════

# ── 基座模型 ─────────────────────────────────────────────────
# 注意 key 名必须与 models.yaml 中的 nutrichat: 对应
nutrichat:
  model: deepseek-ai/DeepSeek-V4-Flash
  provider: siliconflow

# ── EvaluatorLLM 评分模型 ──────────────────────────────────────
evaluator:
  model: mimo-v2.5-pro
  provider: xiaomi

# ── 评估采样 ─────────────────────────────────────────────────
# 正式实验: --query-file queries/layer/evaluation_queries_curated.json（54 条精选集）
# 开发调试: --quick（3% 采样）
evaluation:
  sample_ratio: null          # null=不采样，配合 --query-file 使用全部 54 条

# ── 对比基线 ─────────────────────────────────────────────────
# 少而精路线：弱/中/强三档 + 基座对照，覆盖 capability 谱系
baselines:
  - siliconflow/DeepSeek-V4-Flash       # 基座对照（同模型无架构，量化架构价值）
  - siliconflow/Qwen3-8B                # 弱档（8B 小模型，预期 improvement% 最大）
  # Aliyun 付费模型 403；Qwen 基线改用千问AI平台（qwen3.8-flash 实测可用）
  - qianwen/Qwen3.8-Flash               # 弱-中档（替代 Qwen3.5-Flash）
  - siliconflow/GLM-4.5-Air             # 中档（智谱，跨厂商泛化验证）
  - tencent/MiniMax-M2.5                # 中档（Aliyun 403；Tencent 入口实测可用）
  - deepseek/DeepSeek-V4-Pro            # 强档（旗舰级，测试架构在强基座上的边际贡献）

# ── 其他参数 ─────────────────────────────────────────────────
species: layer
agent_mode: multi
breakdown: true
max_tokens: 512
api:
  timeout: 30
  max_concurrent: 4  # DeepSeek 官方 TPM 限制较宽松
retrieval:
  k: 1

# ── 思考模式白名单 ──────────────────────────────────────────
thinking_baselines: null

# ── 消融实验配置 ──────────────────────────────────────────
# dimensions: 控制跑哪些消融维度（null=全部，list=指定维度）
# 可选值: architecture, synthesis, specialist, router, rag, llm_backbone, language
ablation:
  dimensions:                    # null=全部；指定列表=只跑这些维度
    - architecture
    - architecture_factorial
    - synthesis_factorial
    - rag
    - router
    - synthesis
    - specialist
    - llm_backbone
    - language
  llm_backbone:                    # 覆盖 ablation.yaml 默认，弱/中/强三档 + 基座对照
    - siliconflow/Qwen3-8B         # 弱档（8B 小模型）
    - qianwen/Qwen3.8-Flash        # 弱-中档（替代 Qwen3.5-Flash）
    - siliconflow/DeepSeek-V4-Flash  # 基座对照（NutriAgent 默认基座）
    - qianwen/Qwen3.8-27B          # 中-强档（替代 Qwen3.6-Plus）
    - deepseek/DeepSeek-V4-Pro     # 强档（旗舰级）

# ──────────────────────────────────────────────────────────────
# 评分组件开关（按实验模式）
# ──────────────────────────────────────────────────────────────

# --evaluate 评分：全量评估
scoring_evaluate:
  evaluator_llm: true
  selfcheck: true
  hallucination_ratio: 1.0
  n_selfcheck_values: [5]
  tolerance: true
  flesch: true
  quick:
    sample_ratio: 0.1
    selfcheck: false               # --quick 关闭，省 token
    hallucination_ratio: 1.0

scoring_compare:
  evaluator_llm: true
  selfcheck: true
  hallucination_ratio: 1.0
  n_selfcheck_values: [5]          # 与 evaluate 一致
  tolerance: true                  # 客观数值精度，必开
  flesch: true
  quick:
    sample_ratio: 0.1
    selfcheck: false               # --quick 关闭，省 token
    hallucination_ratio: 1.0

scoring_ablation:
  evaluator_llm: true
  selfcheck: true
  hallucination_ratio: 0.0                 # 0=跳过 SelfCheck 快速出报告
  n_selfcheck_values: [5]
  tolerance: true
  flesch: false
  quick:
    sample_ratio: 0.1
    selfcheck: false               # --quick 关闭，省 token
    hallucination_ratio: 1.0
