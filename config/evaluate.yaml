# NutriAgent evaluation configuration
#
# Used by the --evaluate and --compare commands; CLI arguments can override the values here.
#
#   python main.py --evaluate              # NutriAgent only
#   python main.py --compare               # NutriAgent + baseline comparison
#   python main.py --compare --baselines-only  # baselines only
#   python main.py --evaluate --quick      # dev mode: 3% sample + skip SelfCheck

# ---- Evaluation parameters (global defaults) ----
evaluation:
  # List of N values reported by SelfCheckGPT (N=5 has been verified to differ only marginally from N=20)
  n_selfcheck_values: [5]

  # Number of samples SelfCheckGPT actually generates (empty = use max(n_selfcheck_values))
  n_selfcheck_gen_samples:

  # Stratified sampling (null=all, 0.0-1.0=proportional, >=1=fixed N per category)
  sample_ratio: null

# ---- Agent architecture ----
# multi:  multi-agent system (Router → Specialists → Synthesis)
# both:   compare single vs multi
agent_mode: multi

# ---- Query set ----
# all:     all queries
# chinese: Chinese queries only (ids starting with CN-)
# western: English queries only
query_set: all

# ---- Baseline models (only used with --compare) ----
# Empty = use all baselines (config/models.yaml baselines.models).
# To filter locally, edit the baselines section of config/config.local.yaml.
baselines: null

# ---- Detailed breakdown analysis ----
# Also print breakdown tables by query type and tool category
breakdown: true

# ---- Scoring component switches ----
scoring:
  evaluator_llm: true          # LLM automatic scoring (correctness / precision / depth)
  selfcheck: true              # SelfCheckGPT-NLI hallucination detection (--quick skips it)
  n_selfcheck_values: null     # SelfCheck sample sizes (null=inherit evaluation.n_selfcheck_values)
  tolerance: true              # Tolerance accuracy (±2% / ±5%)
  flesch: true                 # Flesch Reading Ease readability
  shuffle_responses: false     # Randomize response order during evaluation to reduce position bias
