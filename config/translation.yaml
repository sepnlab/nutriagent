# NutriCHAT response translation configuration (export_responses.py --lang zh --api)
#
# The CLI argument --api-model takes precedence over this file.
# All fields are optional; the defaults below are used when unset.

# ── Translation model ───────────────────────────────────────
# Model used for online translation (default Qwen3.5-9B: cheap and adequate)
api_model: "Qwen/Qwen3.5-9B"

# ── API connection ──────────────────────────────────────────
# API URL (empty = reuse the nutrichat provider connection)
# Set this to let translation use a separate API provider
# base_url: "https://api.siliconflow.cn/v1"

# Environment variable name for the API key (empty = reuse the nutrichat provider api_key_env)
# Set this to let translation use a separate API key
# api_key_env: "SILICONFLOW_API_KEY"

# ── Request control ─────────────────────────────────────────
# Timeout in seconds for each translation request
# timeout: 30

# Number of concurrent translation requests (too high may trigger API rate limits)
# concurrency: 4
