[project]
name = "nutrichat"
version = "0.5.0"
description = "NutriCHAT: Reasoning-Driven LLM Agent for Poultry Nutrition Assistance"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langchain-chroma>=1.1.0",
    "chromadb>=1.5.9",
    "openai>=2.36.0",
    "pandas>=3.0.0",
    "numpy>=2.0.0",
    "tiktoken>=0.12.0",
    "python-dotenv>=1.2.1",
    "textstat>=0.7.0",
    "sentence-transformers>=3.0.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "pydantic>=2.0.0",
]

[project.scripts]
nutrichat = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
